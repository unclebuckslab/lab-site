name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Signup Worker tests
        run: npm run test:worker
      - name: Workers config
        run: npx wrangler deploy --dry-run
      - name: Noindex header ships
        run: 'grep -q "X-Robots-Tag: noindex" dist/_headers'
      - name: No private registry values in the built site
        run: npm run check:privacy
      - name: Install Chromium for the accessibility check
        run: npx playwright install --with-deps chromium
      - name: Accessibility (axe WCAG 2.2 AA + 44px targets, light and dark)
        run: npm run check:a11y
